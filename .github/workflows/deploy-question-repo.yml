name: Deploy Quesions

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'                # set this to the node version to use

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Prepare
      run: |
        git clone https://github.com/gurukulams/design-system.git design-system
        cp design-system/package-lock.json .
        cd design-system
        rm package-lock.json
        cp -rf ../questions questions

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Build
      run: |
        cd design-system
        npm i
        npm run build:questions

  # Deployment job
    - name: Deploy
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.QUESTION_REPO_HOST }}
        username: ${{ secrets.QUESTION_REPO_USER }}
        key: ${{ secrets.QUESTION_REPO_KEY }}
        target: ${{ secrets.QUESTION_REPO_WORKSHOP_ROOT }}
        source: "design-system/dist"
        strip_components: 2

