<script>
  
  function login(username) {
    let authRequest = {
      email: username + "@email.com",
      password: username + "password",
    };
    fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "content-type": "application/json",
      },
      body: JSON.stringify(authRequest),
    })
      .then((response) => {
        if (!response.ok) {
          throw Error(response.statusText);
        }
        return response.json();
      })
      .then((auth_response) => {
        if (auth_response.expiresIn) {
          auth_response.expiresIn = Date.now() + auth_response.expiresIn;
          sessionStorage.auth = JSON.stringify(auth_response);
          location.reload();
        } else {
          sessionStorage.setItem("ref_page", window.location.href);
          sessionStorage.setItem("reg_token", auth_response.registrationToken);
          sessionStorage.setItem("profile_pic", auth_response.profilePicture);
          
          window.location.href = '\/\/localhost:1313\/welcome';
        }
      })
      .catch((err) => {
        

        alert(err);
      });
  }

  document.addEventListener('DOMContentLoaded', function() {

    const loginContainer = document.getElementById('login-btn');

    if (loginContainer) {
      loginContainer.addEventListener('click', function(event) {
        
        const targetLink = event.target.closest('.dropdown-item');
        
        if (targetLink) {
          event.preventDefault(); 
          
          
          const img = targetLink.querySelector('img');
          
          if (img && img.getAttribute('src')) {
            const imgSrc = img.getAttribute('src'); 
            
            
            
            
            const username = imgSrc.split('/').pop().split('.').shift();
            
            if (username) {
              login(username);
            }
          }
        }
      });
    }
  });


  function toggleFullScreen(targetElem) {
    
    
    
    const activeFullscreenElem = document.fullscreenElement || document.webkitFullscreenElement;
    const elem = activeFullscreenElem || targetElem;

    if (!elem) return; 

    const existingBtn = document.getElementById('dynamic-fullscreen-exit');

    
    if (existingBtn || activeFullscreenElem) {
        if (existingBtn) existingBtn.remove();

        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {  
            document.webkitExitFullscreen();
        }
    } 
    
    else {
        const exitBtn = document.createElement('a');
        exitBtn.id = 'dynamic-fullscreen-exit';
        exitBtn.className = 'fullscreen-floating-btn';
        exitBtn.href = 'javascript://';
        exitBtn.innerHTML = '<i class="bi bi-fullscreen-exit"></i>';
        
        
        exitBtn.onclick = () => toggleFullScreen(elem);
        
        elem.appendChild(exitBtn);

        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {  
            elem.webkitRequestFullscreen();
        }
    }
}



const cleanUpExitBtn = () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const existingBtn = document.getElementById('dynamic-fullscreen-exit');
        if (existingBtn) existingBtn.remove();
    }
};
document.addEventListener('fullscreenchange', cleanUpExitBtn);
document.addEventListener('webkitfullscreenchange', cleanUpExitBtn);
</script>
